name: PwL
options:
  bundleIdPrefix: com.khoadinh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.2
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 5AXK5DDBB7
    CODE_SIGN_STYLE: Automatic
    # REVERSED_CLIENT_ID from Config/GoogleService-Info.plist (Firebase project pwl-application).
    # Google sign-in returns to the app through this URL scheme; update it if the Firebase app changes.
    GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.955594663762-8jmm4shrv62351t67glcfjmftd2mpfl3
targets:
  PwL:
    type: application
    platform: iOS
    sources: [PwL]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    postBuildScripts:
      - name: Firebase config
        basedOnDependencyAnalysis: false
        script: |
          # Config/GoogleService-Info.plist comes from the Firebase console (see CLAUDE.md).
          # It's optional: without it the app uses the local test backend.
          CONFIG="${SRCROOT}/Config/GoogleService-Info.plist"
          BUNDLED="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          rm -f "$BUNDLED"
          if [ -f "$CONFIG" ]; then
            cp "$CONFIG" "$BUNDLED"
          fi
    info:
      path: Config/Info.plist
      properties:
        NSLocalNetworkUsageDescription: PwL connects to your love's phone nearby so you can play together.
        NSPhotoLibraryUsageDescription: Choose a photo for your PwL avatar.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        NSBonjourServices:
          - _pwl-game._tcp
          - _pwl-game._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khoadinh.PwL
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PwL
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        # Landscape is allowed only so the Onet match can rotate; OrientationLock keeps every other screen portrait.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: -ObjC
  PwLTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PwLTests]
    dependencies:
      - target: PwL
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.khoadinh.PwLTests
schemes:
  PwL:
    build:
      targets:
        PwL: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [PwLTests]
